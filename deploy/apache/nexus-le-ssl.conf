<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName nexus.tristech.de
    ServerAdmin webmaster@localhost

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/nexus_error.log
    CustomLog ${APACHE_LOG_DIR}/nexus_access.log combined

    # nexus terminates nothing itself: Apache owns TLS and proxies to the loopback-bound
    # bun process, which serves the API and the built web app from one origin (ADR-8).
    ProxyPreserveHost On
    ProxyRequests Off

    # flushpackets makes mod_proxy_http write through instead of buffering, which is what
    # keeps GET /api/sessions/:id/events (text/event-stream) live rather than delivered in
    # batches once the response ends. ProxyTimeout is well above the stream's 20s
    # heartbeat interval, so an idle session is not cut off between turns.
    ProxyPass / http://127.0.0.1:8787/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8787/
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "https"

    # A private window into repositories and agent sessions on this host: keep it out of
    # search indexes, archives and caches.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    # SSL
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/nexus.tristech.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nexus.tristech.de/privkey.pem
</VirtualHost>
</IfModule>
